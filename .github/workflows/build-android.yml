name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/sholohovsky-debug.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java, Android SDK and debug signing
        shell: bash
        run: |
          set -euxo pipefail
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          test -x "$ANDROID_HOME/platform-tools/adb"
          keytool -genkeypair -v -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
            -keypass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
            -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype PKCS12
          mkdir -p "$HOME/.config/godot"
          SETTINGS="$HOME/.config/godot/editor_settings-4.4.tres"
          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          export/android/debug_keystore_user = "$GODOT_ANDROID_KEYSTORE_DEBUG_USER"
          export/android/debug_keystore_pass = "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD"
          EOF
          cat "$SETTINGS"

      - name: Install Godot 4.4.1 export templates
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y curl unzip
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          SDKMANAGER_STATUS="${PIPESTATUS[1]}"
          set -e
          test "$SDKMANAGER_STATUS" -eq 0
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -d "$ANDROID_HOME/platforms/android-34"
          VERSION_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$VERSION_DIR" /tmp/godot-templates
          curl -L --fail --retry 3 -o /tmp/godot-export-templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q /tmp/godot-export-templates.tpz -d /tmp/godot-templates
          test -d /tmp/godot-templates/templates
          cp -a /tmp/godot-templates/templates/. "$VERSION_DIR/"
          test -s "$VERSION_DIR/android_debug.apk"
          test -s "$VERSION_DIR/android_release.apk"
          ls -lh "$VERSION_DIR/android_debug.apk" "$VERSION_DIR/android_release.apk"

      - name: Validate project
        run: godot --headless --editor --path . --quit

      - name: Diagnose Android export preset
        shell: bash
        run: |
          set -euxo pipefail
          echo "HOME=$HOME"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/Sholohovsky-3D-debug.apk
          test -s build/Sholohovsky-3D-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sholohovsky-3D-Android-debug
          path: build/Sholohovsky-3D-debug.apk
          retention-days: 14
