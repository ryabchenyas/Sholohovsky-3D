name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Sholohovsky-3D-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sholohovsky-3D-Android-debug
          path: build/Sholohovsky-3D-debug.apk
          retention-days: 14
